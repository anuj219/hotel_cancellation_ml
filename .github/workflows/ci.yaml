name: CI - Test, Build and Push

on:
  push:
    branches:
      - main

permissions:
  contents: read # allows it to read/checkout your repository
  id-token: write # allows it to ask GitHub for an OIDC identity token

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get our source code
      - name: Checkout repository
        uses: actions/checkout@v4
      # downloads your GitHub repository onto ubuntu runner

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install only what CI needs for the fast tests
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      # 4. Run tests WITHOUT the real model
      - name: Run tests
        run: pytest -v -m "not integration"
        # Fast tests → fake model → no 364 MB .pkl required
        # Integration test → actual model → requires private artifact

      # - name: Show GitHub OIDC claims
      #   uses: actions/github-script@v8
      #   id: oidc
      #   with:
      #     script: |
      #       const token = await core.getIDToken('sts.amazonaws.com');

      #       const payload = token.split('.')[1];
      #       const decoded = JSON.parse(
      #         Buffer.from(payload, 'base64url').toString()
      #       );

      #       console.log("aud:", decoded.aud);
      #       console.log("sub:", decoded.sub);
      #       console.log("repository:", decoded.repository);
      #       console.log("repository_id:", decoded.repository_id);
      #       console.log("repository_owner_id:", decoded.repository_owner_id);

      # 5. Ask AWS to let this workflow assume our IAM role
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::665814845520:role/HotelCancellationGitHubActionsRole
          aws-region: us-east-1
        # “Use my GitHub OIDC identity and ask AWS to assume HotelCancellationGitHubActionsRole
        # get OIDC token from GH -> send token to aws sts -> AWS checks trust policy and allows/denies

      # 6. Login Docker to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Build and push the Docker image
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: hotel-cancellation-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 8. test the SSM remote deployment
      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-01f5528f452fae392" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["/opt/hotel-api/deploy.sh ${{ github.sha }}"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-01f5528f452fae392"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-01f5528f452fae392"