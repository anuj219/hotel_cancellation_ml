name: CI - Test, Build and Push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get our source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install only what CI needs for the fast tests
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      # 4. Run tests WITHOUT the real model
      - name: Run tests
        run: pytest -v -m "not integration"

      # 5. Ask AWS to let this workflow assume our IAM role
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::665814845520:role/HotelCancellationGitHubActionsRole
          aws-region: us-east-1

      # 6. Login Docker to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Build and push the Docker image
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: hotel-cancellation-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG